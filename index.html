<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>佐藤愛吹 画像</title>
  <meta name="description" content="佐藤愛吹の画像を大きく表示するページです。">
  <meta name="robots" content="index,follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="佐藤愛吹 画像">
  <meta property="og:description" content="佐藤愛吹の画像を大きく表示するページです。">
  <meta property="og:image" content="https://example.com/sato-ibuki.jpg">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }
    main {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    @media (min-width: 900px) {
      img {
        width: min(100vw, 1800px);
        max-width: none;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="sato-ibuki.jpg"
         alt="佐藤愛吹"
         width="449"
         height="595"
         loading="eager"
         fetchpriority="high">
  </main>
</body>
</html>
